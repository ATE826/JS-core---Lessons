<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Lesson 42</title>
  </head>
  <body>
    <div class="container">
      <h1 class="py-4">Lesson 42</h1>
      <div class="row">
        <div class="col-4">
          <div class="alert alert-warning">Please, fill the form</div>
          <form action="#" name="user-form" class="p-4 mb-4 border rounded">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" name="name" id="name" class="form-control" />
            </div>
            <div class="mb-3">
              <label for="age" class="form-label">Age</label>
              <input type="number" name="age" id="age" class="form-control" />
            </div>
            <button type="submit" class="btn btn-primary">Send</button>
            <button type="button" class="btn btn-danger" name="stop-blink">
              Stop blink
            </button>
          </form>
          <div class="alert" id="form-status"></div>
        </div>
        <div class="col-4">
          <div class="alert" id="this-context"></div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
