<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Lesson 36</title>
  </head>
  <body>
    <div class="container">
      <h1 class="py-4">Lesson 36</h1>
      <div class="row">
        <form action="" class="col-4" name="event-time">
          <div class="mb-3">
            <label for="date" class="form-label">Event date</label>
            <input type="date" class="form control" name="date" id="date" />
          </div>
          <div class="mb-3">
            <label for="time" class="form-label">Event time</label>
            <input type="time" class="form control" name="time" id="time" />
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <div class="col-4">
          <div class="alert alert-warning h-100">
            <div class="fs-5 fw-bold text-capitalize">Now date:</div>
            <div class="mb-2" id="now-date"></div>
            <div class="fs-5 fw-bold text-capitalize">Event date:</div>
            <div class="mb-2" id="event-date"></div>
            <div class="fs-5 fw-bold text-capitalize">Period:</div>
            <div class="mb-2" id="period"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
