<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USERS APP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="#" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <!-- добавим стили mocha для отображения результатов -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/mocha/3.2.0/mocha.css"
    />
    <!-- добавляем сам фреймворк mocha -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/3.2.0/mocha.js"></script>
    <script>
      // включаем режим тестирования в стиле BDD
      mocha.setup("bdd");
    </script>
    <!-- добавим chai -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/3.5.0/chai.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="py-4">Users App</h1>
      <div class="row">
        <div class="px-3 col-4">
          <form action="" name="user-form" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                required
                name="name"
                id="name"
              />
              <div class="invalid-feedback">Name is required!</div>
              <div class="valid-feedback">Looks good!</div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                required="required"
                name="email"
                id="email"
              />
              <div class="invalid-feedback">Please, enter correct email!</div>
              <div class="valid-feedback">Looks good!</div>
            </div>
            <div class="mb-3">
              <label for="code" class="form-label">Code</label>
              <input
                type="number"
                class="form-control"
                required="required"
                name="code"
                id="code"
              />
              <div class="invalid-feedback">Code is required!</div>
              <div class="valid-feedback">Looks good!</div>
            </div>
            <button type="submit" class="btn btn-dark mt-1">Submit</button>
          </form>
          <!-- элемент с id="mocha" будет содержать результаты тестов -->
          <div id="mocha" class="mt-4"></div>
        </div>
        <div class="px-3 col-8">
          <form action="" class="d-flex col-6 mb-4" name="filter-form">
            <input
              type="search"
              name="filter"
              class="form-control me-2"
              placeholder="Enter search filter..."
            />
          </form>
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th data-sort="id">ID</th>
                <th data-sort="name">NAME</th>
                <th data-sort="email">EMAIL</th>
                <th data-sort="code">CODE</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="scripts/main.js" type="module"></script>
  </body>
</html>
