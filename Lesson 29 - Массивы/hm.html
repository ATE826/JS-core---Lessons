<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="hw.css" />
    <title>Hw 29</title>
  </head>
  <body class="container">
    <h1 class="py-4" id="heading1">Homework 29</h1>
    <div class="row gap-5">
      <div class="col-4 d-flex justify-content-center">
        <form action="#" name="tasks">
          <input
            type="text"
            class="form-control mb-2"
            placeholder="Enter task text"
            name="task"
          />
          <div class="row gap-2">
            <button type="submit" class="btn btn-success">Add</button>
            <button type="button" class="btn btn-danger">Delete last</button>
            <button type="button" class="btn btn-warning">Sort</button>
          </div>
        </form>
      </div>
      <div class="col-4 rounded border bg-light pt-2" style="height: 20rem">
        <ul class="list-group d-flex flex-column"></ul>
      </div>
    </div>
    <script src="hw.js"></script>
  </body>
</html>
