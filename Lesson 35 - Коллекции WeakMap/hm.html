<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Hw 30</title>
  </head>
  <body class="container">
    <h1 class="py-4" id="heading1">Homework 30</h1>
    <div class="row">
      <div class="col-4">
        <form
          action=""
          class="form d-flex justify-content-center flex-column"
          name="car-form"
        >
          <input
            type="text"
            name="name"
            class="form-control mb-2"
            placeholder="Enter car name..."
          />
          <input
            type="number"
            name="year"
            class="form-control mb-2"
            placeholder="Enter car production year..."
          />
          <input
            type="text"
            name="color"
            class="form-control mb-2"
            placeholder="Enter car color..."
          />
          <button class="btn btn-success" type="submit">Add car</button>
        </form>
      </div>
      <div class="col-4 ms-4 border rounded bg-light" style="height: 30rem">
        <ul class="list-group"></ul>
      </div>
    </div>
    <script src="hw.js"></script>
  </body>
</html>
