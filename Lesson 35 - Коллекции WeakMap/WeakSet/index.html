<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Lesson 35</title>
  </head>
  <body>
    <div class="container">
      <h1 class="py-4">Lesson 35</h1>
      <div class="row mb-4">
        <div class="col-7">
          <form action="#" class="d-flex justify-content-between">
            <div class="w-50 pe-2">
              <select
                name="worker-select"
                id="worker-select"
                class="form-select"
              >
                <option value="" selected disabled>Select a worker</option>
              </select>
            </div>
            <div>
              <button type="button" class="btn btn-primary" id="get-salary-btn">
                Get salary
              </button>
              <button type="button" class="btn btn-danger" id="fire-worker-btn">
                Fire worker
              </button>
              <button type="button" class="btn btn-warning" id="show-cache-btn">
                Show cache
              </button>
            </div>
          </form>
        </div>
      </div>
      <div class="row mb-4">
        <div class="col-7">
          <div class="alert alert-warning">
            <div class="mb-2 d-flex" id="worker-salary-info">
              Info about worker salary
            </div>
            <div class="d-flex justify-content-between" id="cache-status"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
